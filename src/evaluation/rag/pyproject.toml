    "langchain>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "scikit-learn>=1.3.0",
    "tiktoken>=0.5.0",
    "transformers>=4.30.0",
    "regex>=2023.0.0",
    "unicodedata2>=15.0.0",
    "rank-bm25>=0.2.2",
    "ragas>=0.4.1",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "httpx>=0.24.0",
    "langchain-google-genai>=1.0.0",
