[project]
name = "orchestrator-agent"
version = "0.1.0"
description = "Orchestrator Agent A2A"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # A2A Protocol
    "a2a-sdk==0.3.22",
    "python-dotenv>=1.0.0",
    # LangChain
    "langchain==0.3.27",
    "langchain-google-genai==2.1.9",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.5",
    "fastapi>=0.118.0",
    "redis>=6.3.0",
    "httpx>=0.25",
    "asyncpg>=0.29.0",
    "pypdf2>=3.0.1",
    "scikit-learn>=1.8.0",
    "qdrant-client==1.15.1",
    "sentence-transformers>=5.2.0",
    "python-multipart",
]

[tool.uv.workspace]
members = [
    "orchestrator-agent",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true